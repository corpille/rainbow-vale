<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rainbow Vale</title>
    <style>
      /* Everything visible is drawn on a canvas: no text node or padded box exists in the
         document, so there is nothing here for box-sizing/color/font-family to apply to.
         Absolutely positioned elements are display:block by spec, so the canvases need no
         rule of their own either. */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: #dff0ff;
      }
      #game {
        position: absolute;
        top: 0;
        left: 0;
      }

      /* always-on spell bar — horizontal position is set in JS (ui-panel.js), measured
         off the real canvas width in pixels so it's exactly centered regardless of any
         vw/scrollbar discrepancy */
      #o {
        position: absolute;
        left: 0;
        bottom: 2%;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <canvas id="o" width="1" height="1"></canvas>

    <script>
      /*BUILD:INJECT_JS*/
    </script>
  </body>
</html>
