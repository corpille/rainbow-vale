<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rainbow Vale</title>
    <style>
      /* Everything visible is drawn on a canvas — there is not a single text node or
         padded/bordered box in the document, so box-sizing, color and font-family have
         nothing to apply to. Absolutely positioned elements are display:block by spec,
         so the canvas rule was redundant too, as was `background: transparent` on #o
         (the default) and `padding: 0` on html/body (never had any). */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: #dff0ff;
      }
      .frame {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      #game {
        position: absolute;
        top: 0;
        left: 0;
      }

      /* always-on spell bar — horizontal position is set in JS (ui-panel.js), measured
         off the real canvas width in pixels so it's exactly centered regardless of any
         vw/scrollbar discrepancy */
      #o {
        position: absolute;
        left: 0;
        bottom: 2%;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <canvas id="game"></canvas>

      <canvas id="o" width="1" height="1"></canvas>
    </div>

    <script>
      /*BUILD:INJECT_JS*/
    </script>
  </body>
</html>
