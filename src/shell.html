<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rainbow Vale</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: #dff0ff;
        color: #4a3f66;
        font-family: 'Trebuchet MS', sans-serif;
      }
      .frame {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      canvas {
        display: block;
        background: #dff0ff;
      }
      #game {
        position: absolute;
        top: 0;
        left: 0;
      }

      /* always-on spell bar — horizontal position is set in JS (ui-panel.js), measured
         off the real canvas width in pixels so it's exactly centered regardless of any
         vw/scrollbar discrepancy */
      #o {
        position: absolute;
        left: 0;
        bottom: 2%;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <canvas id="game"></canvas>

      <canvas id="o" width="1" height="1"></canvas>
    </div>

    <script>
      /*BUILD:INJECT_JS*/
    </script>
  </body>
</html>
