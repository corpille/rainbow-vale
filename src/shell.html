<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Rainbow Vale</title>
    <style>
      :root {
        --bg: #dff0ff;
        --text: #4a3f66;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
      }
      /* 100dvh (falls back to 100vh) tracks the real visible viewport as mobile browser
     chrome shows/hides — 100vh alone can be taller than what's on screen, clipping or
     misplacing bottom-anchored UI */
      .frame {
        position: relative;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      canvas {
        display: block;
        background: #dff0ff;
        touch-action: none;
      }
      #game {
        position: absolute;
        top: 0;
        left: 0;
      }

      /* always-on spell bar — horizontal position is set in JS (ui-panel.js), measured
         off the real canvas width in pixels so it's exactly centered regardless of any
         vw/scrollbar discrepancy; bottom margin is fixed, not scaled */
      #o {
        position: absolute;
        left: 0;
        bottom: calc(40px + env(safe-area-inset-bottom));
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <canvas id="game"></canvas>

      <canvas id="o" width="1" height="1"></canvas>
    </div>

    <script>
      /*BUILD:INJECT_JS*/
    </script>
  </body>
</html>
